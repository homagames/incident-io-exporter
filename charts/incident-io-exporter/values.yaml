replicaCount: 1

image:
  repository: ghcr.io/homagames/incident-io-exporter
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to appVersion

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 9090

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

env:
  LISTEN_ADDRESS: ":9090"
  METRICS_PATH: "/metrics"
  LOG_LEVEL: "info"

# Optional: reference to an existing Kubernetes Secret containing INCIDENT_IO_API_KEY.
# If not set, you must provide INCIDENT_IO_API_KEY via the env map above.
existingSecret: ""
# Key in the secret that contains the API key (only used when existingSecret is set)
secretKey: "api-key"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

nodeSelector: {}
tolerations: []
affinity: {}
