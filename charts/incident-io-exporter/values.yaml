replicaCount: 1

image:
  repository: ghcr.io/homagames/incident-io-exporter
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to appVersion

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 9090

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

env:
  LISTEN_ADDRESS: ":9090"
  METRICS_PATH: "/metrics"
  LOG_LEVEL: "info"

# Reference to an existing secret containing INCIDENT_IO_API_KEY
existingSecret: ""
# Key in the secret that contains the API key
secretKey: "api-key"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

nodeSelector: {}
tolerations: []
affinity: {}
